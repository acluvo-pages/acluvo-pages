<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Operations Analysis — Demo</title>
  <style>body{font-family:Arial;margin:16px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:6px;text-align:left}thead{background:#f3f3f3}</style>
</head>
<body>
  <h1>Operations Analysis — Demo</h1>
  <p>Filter by service and status, inspect durations.</p>

  <label>Service: <select id="serviceFilter"><option value="all">All</option></select></label>
  <label style="margin-left:12px">Status: <select id="statusFilter"><option value="all">All</option></select></label>
  <button id="apply">Apply</button>

  <h2>Summary</h2>
  <div id="summary"></div>

  <h2>Events</h2>
  <table id="events"><thead><tr><th>time</th><th>service</th><th>status</th><th>duration_ms</th><th>message</th></tr></thead><tbody></tbody></table>

  <script>
    async function load(){
      const res = await fetch('data/ops.json');
      return res.json();
    }
    function populateFilters(data){
      const services = [...new Set(data.map(d=>d.service))];
      const statuses = [...new Set(data.map(d=>d.status))];
      const sEl = document.getElementById('serviceFilter');
      services.forEach(s=> sEl.appendChild(new Option(s,s)));
      const stEl = document.getElementById('statusFilter');
      statuses.forEach(s=> stEl.appendChild(new Option(s,s)));
    }
    function renderTable(rows){
      const tbody = document.querySelector('#events tbody'); tbody.innerHTML='';
      rows.forEach(r=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>${r.time}</td><td>${r.service}</td><td>${r.status}</td><td>${r.duration_ms}</td><td>${r.message}</td>`; tbody.appendChild(tr) });
    }
    function renderSummary(rows){
      const avg = rows.length ? (rows.reduce((s,r)=>s+r.duration_ms,0)/rows.length).toFixed(1) : 0;
      const failures = rows.filter(r=>r.status!=='ok').length;
      document.getElementById('summary').innerText = `Events: ${rows.length} · Avg duration: ${avg}ms · Failures: ${failures}`;
    }

    let allData = [];
    load().then(data=>{ allData = data; populateFilters(data); renderSummary(data); renderTable(data); });

    document.getElementById('apply').addEventListener('click', ()=>{
      const sv = document.getElementById('serviceFilter').value;
      const st = document.getElementById('statusFilter').value;
      let rows = allData.slice();
      if(sv!=='all') rows = rows.filter(r=>r.service===sv);
      if(st!=='all') rows = rows.filter(r=>r.status===st);
      renderSummary(rows); renderTable(rows);
    });
  </script>
</body>
</html>
