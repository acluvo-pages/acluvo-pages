name: Build and Deploy Examples

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Ensure the default token has permissions to push generated files
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run report generator
        run: python examples/automated-reporting/generate_report.py

      - name: Prepare static site
        run: |
          rm -rf site
          mkdir -p site/examples/business-kpi-dashboard
          mkdir -p site/examples/operations-analysis
          mkdir -p site/examples/automated-reporting
          cp -r examples/business-kpi-dashboard/* site/examples/business-kpi-dashboard/
          cp -r examples/operations-analysis/* site/examples/operations-analysis/
          cp examples/automated-reporting/report.html site/examples/automated-reporting/report.html
          # Ensure Jekyll is disabled on Pages branch
          touch site/.nojekyll
          # Create a simple landing page that links to the examples
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Acluvo Examples</title>
            <style>body{font-family:Arial;margin:24px}ul{line-height:1.6}</style>
          </head>
          <body>
            <h1>Acluvo Examples</h1>
            <p>Available demo projects:</p>
            <ul>
              <li><a href="examples/business-kpi-dashboard/index.html">Business KPI Dashboard</a></li>
              <li><a href="examples/operations-analysis/index.html">Operations Analysis</a></li>
              <li><a href="examples/automated-reporting/report.html">Automated Reporting (generated)</a></li>
            </ul>
            <p>Visit the links above to open each demo.</p>
          </body>
          </html>
          HTML

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
